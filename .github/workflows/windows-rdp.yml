name: WINDOWS RDP - CLOUDFLARE

on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "✅ RDP Enabled Successfully!"

      - name: Set Administrator Password
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "Yard4rein@." -Force)
          Write-Host "✅ Password Configured!"

      - name: Start Cloudflare Tunnel
        run: |
          Write-Host "============================================"
          Write-Host "🚀 WINDOWS RDP - CLOUDFLARE TUNNEL"
          Write-Host "============================================"
          Write-Host ""

          # Start cloudflared and capture output
          $process = Start-Process -FilePath "cloudflared" -ArgumentList "tunnel --url tcp://localhost:3389" -NoNewWindow -PassThru -RedirectStandardError "cloudflared.log" -RedirectStandardOutput "cloudflared-out.log"
          
          # Wait for the tunnel URL to appear
          $url = $null
          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path "cloudflared.log") {
              $content = Get-Content "cloudflared.log" -Raw
              if ($content -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                $url = $Matches[0]
                break
              }
            }
          }

          if ($url) {
            Write-Host ""
            Write-Host "============================================"
            Write-Host "✅ TUNNEL READY!"
            Write-Host "Tunnel URL: $url"
            Write-Host "============================================"
            Write-Host ""
            Write-Host "📋 CONNECTION DETAILS:"
            Write-Host "   USERNAME: runneradmin"
            Write-Host "   PASSWORD: Yard4rein@."
            Write-Host "   Computer (after local tunnel): localhost:3389"
            Write-Host "============================================"
          } else {
            Write-Host "⚠️ Could not capture tunnel URL automatically."
            Write-Host "Check cloudflared.log contents:"
            Get-Content "cloudflared.log" -ErrorAction SilentlyContinue
          }

          # Keep the session alive
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "✓ Active - $(Get-Date -Format 'HH:mm:ss')"
          }
