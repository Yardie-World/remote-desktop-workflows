name: WINDOWS RDP - CLOUDFLARE

on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Setup Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Enable Windows RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
          Write-Host "✅ RDP Enabled Successfully!"

      - name: Set Administrator Password
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "Yard4rein@." -Force)
          Write-Host "✅ Password Configured!"

      - name: Start Cloudflare Tunnel
        run: |
          Write-Host "============================================"
          Write-Host "🚀 WINDOWS RDP - CLOUDFLARE TUNNEL"
          Write-Host "============================================"
          Write-Host ""

          # Start cloudflared and redirect logs
          Start-Process -FilePath "cloudflared" -ArgumentList "tunnel --url tcp://localhost:3389" -NoNewWindow -RedirectStandardError "cf.log" -RedirectStandardOutput "cf-out.log"

          # Wait and extract the trycloudflare URL
          $url = $null
          for ($i = 1; $i -le 40; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path "cf.log") {
              $log = Get-Content "cf.log" -Raw -ErrorAction SilentlyContinue
              if ($log -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                $url = $Matches[0]
                break
              }
            }
          }

          Write-Host ""
          if ($url) {
            Write-Host "============================================"
            Write-Host "✅ TUNNEL IS READY!"
            Write-Host "Tunnel URL → $url"
            Write-Host "============================================"
          } else {
            Write-Host "Could not automatically detect the URL. Full log:"
            Get-Content "cf.log" -ErrorAction SilentlyContinue
          }

          Write-Host ""
          Write-Host "📋 CONNECTION DETAILS:"
          Write-Host "   Username : runneradmin"
          Write-Host "   Password : Yard4rein@."
          Write-Host "   After starting local cloudflared → connect to localhost:3389"
          Write-Host "============================================"

          # Keep alive
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "✓ Active - $(Get-Date -Format 'HH:mm:ss')"
          }
