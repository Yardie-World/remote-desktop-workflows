      - name: Start Cloudflare Tunnel
        run: |
          Write-Host "============================================"
          Write-Host "🚀 WINDOWS RDP - CLOUDFLARE TUNNEL"
          Write-Host "============================================"
          Write-Host ""
          
          # Run cloudflared in the background and capture the URL
          $job = Start-Job -ScriptBlock {
            cloudflared tunnel --url tcp://localhost:3389 2>&1
          }
          
          # Wait a bit and get the output
          Start-Sleep -Seconds 12
          $output = Receive-Job $job
          
          Write-Host $output
          Write-Host ""
          Write-Host "📋 CONNECTION DETAILS:"
          Write-Host "   USERNAME: runneradmin"
          Write-Host "   PASSWORD: Yard4rein@."   # ← your current password
          Write-Host "   OS: Windows Server 2022"
          Write-Host "============================================"
          
          # Keep the job running
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host "✓ Tunnel still active - $(Get-Date -Format 'HH:mm:ss')"
          }
